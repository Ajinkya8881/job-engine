name: Job Engine 24/7

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  push:
    branches: [ main ] # Run immediately on every push to main
  workflow_dispatch: # Allow manual trigger button

jobs:
  scan-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Job Engine
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python main.py --run-once

    - name: Commit & Push New Jobs
      run: |
        git config --global user.name "JobBot"
        git config --global user.email "bot@github.com"
        git add storage/jobs.db
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Auto-update jobs.db [skip ci]"
          git pull --rebase origin main
          git push origin main
        else
          echo "No changes to commit"
        fi
